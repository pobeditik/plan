<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Статус проекта ГДТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#ECE8E1;--surface:#F7F4EF;--raised:#FBF9F6;--sunk:#E3DDD3;
 --rule:#DDD6CA;--rule2:#C9BFAF;
 --ink:#3A3633;--ink2:#655D55;--ink3:#948A7F;
 --red:#CE1B2C;--red-t:#F6DEDB;--red-w:#FBEDEB;
 --green:#538234;--green2:#97AD7F;--green-t:#E3EADB;
 --ochre:#A5701C;--ochre-t:#F2E4C8;
 --work:#7C736A;--work-t:#E2DCD3;--ghost:#D3CABA;
 --lw:640px;--rh:42px;--hd:54px;
 --spring:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.22,1,.36,1);
 --sans:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:65;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:28px;padding:14px 28px 0;flex-wrap:wrap}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.1}
.brand p{margin:3px 0 0;color:var(--ink3);font-size:13px}
.brand p b{color:var(--ink2);font-weight:600}
.sp{flex:1}

.me button{border:0;background:none;padding:0;color:var(--ink2);font-weight:600;text-decoration:underline;text-decoration-color:var(--rule2);text-underline-offset:3px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule2);background:var(--raised);border-radius:9px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--ink);transition:transform .14s var(--spring),background-color .15s,border-color .15s}
.btn:hover{border-color:var(--ink3)}
.btn:active{transform:scale(.96)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk)}
nav.tabs{display:flex;gap:4px;padding:10px 24px 0;margin-bottom:-1px}
nav.tabs button{position:relative;border:0;background:none;padding:10px 14px 12px;font-size:15px;font-weight:600;color:var(--ink3);border-radius:9px 9px 0 0;transition:color .15s}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on:after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2.5px;border-radius:2px;background:var(--ink)}
nav.tabs .cnt{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 6px;margin-left:7px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;font-weight:700;vertical-align:1px}
nav.tabs .cnt.z{background:var(--sunk);color:var(--ink3)}
main{padding:22px 28px 60px}
section.tab{display:none;animation:fade .22s var(--out)}
section.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- сводка ---------- */
.sum{max-width:1320px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:20px 22px 18px;position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--st)}
.p-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.p-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.p-head .sub{color:var(--ink3);font-size:13px}
.rag{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--st)}
.rag i{width:10px;height:10px;border-radius:50%;background:var(--st);box-shadow:0 0 0 3px color-mix(in srgb,var(--st) 20%,transparent)}
.p-main{display:grid;grid-template-columns:auto 1fr;gap:6px 26px;align-items:end;margin:16px 0 14px}
.big{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:.95;color:var(--bigc,var(--ink))}
.big small{font-size:18px;font-weight:600;letter-spacing:0;margin-left:4px}
.big-cap{font-size:13px;color:var(--ink3);margin-top:6px}
.facts{display:grid;gap:3px;font-size:14px;color:var(--ink2);align-self:center}
.facts b{color:var(--ink);font-weight:600}
.bullet{margin-top:4px}
.bullet .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3);margin-bottom:5px}
.bullet .lab b{color:var(--ink);font-weight:600}
.bar-b{position:relative;height:14px;border-radius:4px;background:var(--sunk)}
.bar-b .v{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--ink2)}
.bar-b .m{position:absolute;top:-4px;bottom:-4px;width:2.5px;border-radius:2px;background:var(--ink)}
.strip{margin-top:14px}
.strip svg{display:block;width:100%;height:58px;overflow:visible}
.now{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);font-size:14px;color:var(--ink2);display:grid;gap:3px}
.now b{color:var(--ink);font-weight:600}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:34px 0 12px}
.sec-h h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.sec-h .sub{color:var(--ink3);font-size:13px}
.plist{display:grid;gap:8px}
.pli{display:grid;grid-template-columns:1fr 150px 120px 96px;gap:18px;align-items:center;background:var(--raised);border:1px solid color-mix(in srgb,var(--red) 32%,var(--rule));border-left:5px solid var(--red);border-radius:12px;padding:12px 18px;cursor:pointer;transition:transform .16s var(--spring),box-shadow .2s}
.pli:hover{box-shadow:0 6px 22px -10px color-mix(in srgb,var(--red) 55%,transparent)}
.pli:active{transform:scale(.995)}
.pli.gd{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 0%,transparent)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--red) 28%,transparent),0 0 28px -2px color-mix(in srgb,var(--red) 60%,transparent)}}
.pli .op{font-weight:600;font-size:15px}
.pli .op em{font-style:normal;color:var(--ink3);font-weight:500;font-size:13px;margin-left:8px}
.pli .pr{color:var(--ink2);font-size:13.5px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pli .k{font-size:12px;color:var(--ink3)}
.pli .v2{font-size:14px;font-weight:600}
.tag-gd{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--red);border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:2px}
.empty{padding:22px;border:1px dashed var(--rule2);border-radius:12px;color:var(--ink3);text-align:center}
.rules{margin-top:26px;font-size:12.5px;color:var(--ink3);display:flex;gap:22px;flex-wrap:wrap}
.rules span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:0}

/* ---------- фильтры ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule2);background:var(--raised);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--ink2);transition:transform .14s var(--spring),background-color .15s,color .15s,border-color .15s}
.chip:active{transform:scale(.95)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink3))}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.on i{box-shadow:0 0 0 2px var(--paper)}
.fsel{border:1px solid var(--rule2);background:var(--raised);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2)}
.fdiv{width:1px;height:20px;background:var(--rule2);margin:0 4px}
.freset{border:0;background:none;color:var(--ink3);font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* ---------- проблемные вопросы ---------- */
.iss-top{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.iss-top h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.iss-top p{margin:0;color:var(--ink3);font-size:13.5px}
.cards{display:grid;gap:14px;max-width:1320px}
.card{background:var(--raised);border:1px solid color-mix(in srgb,var(--red) 30%,var(--rule));border-radius:16px;position:relative;overflow:hidden;transition:box-shadow .25s}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--red)}
.card.gd{background:color-mix(in srgb,var(--red) 6%,var(--raised));box-shadow:0 0 0 2px color-mix(in srgb,var(--red) 65%,transparent),0 12px 36px -12px color-mix(in srgb,var(--red) 75%,transparent)}
.card.gd:before{animation:rail 2.6s ease-in-out infinite}
@keyframes rail{50%{box-shadow:0 0 18px 4px color-mix(in srgb,var(--red) 55%,transparent)}}
.card.lit{animation:ignite 1.1s var(--out)}
@keyframes ignite{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 70%,transparent);transform:scale(.985)}40%{box-shadow:0 0 0 8px color-mix(in srgb,var(--red) 25%,transparent),0 0 40px 6px color-mix(in srgb,var(--red) 45%,transparent);transform:scale(1)}100%{box-shadow:0 0 0 0 transparent}}
.card.done{border-color:var(--rule)}.card.done:before{background:var(--green2)}
.c-head{display:flex;gap:14px;align-items:flex-start;padding:16px 20px 12px 26px;border-bottom:1px solid var(--rule)}
.c-title{flex:1;min-width:0}
.c-title .blk{font-size:12.5px;color:var(--ink3);margin-bottom:2px}
.c-title h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.c-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--ink2)}
.c-meta b{font-weight:600;color:var(--ink)}
.c-meta .late{color:var(--ochre);font-weight:600}
.c-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--ink2);transition:background-color .18s var(--spring),color .15s}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(58,54,51,.18)}
.seg button.on.r{background:var(--red);color:#fff}
.seg button.on.g{background:var(--green);color:#fff}
.gdt{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink2);border:1px solid var(--rule2);background:var(--raised);border-radius:9px;padding:5px 11px}
.gdt.on{background:var(--red);border-color:var(--red);color:#fff}
.gdt{white-space:nowrap}.gdt svg{width:15px;height:15px;flex:none}
.drawer{visibility:hidden;transition:transform .42s var(--spring),visibility 0s linear .42s}
.drawer.on{visibility:visible;transition:transform .42s var(--spring),visibility 0s}
.pipe{display:grid;gap:6px}
.pipe-h{display:flex;align-items:baseline;gap:10px}
.pipe-h h4{margin:0;font-size:13px;font-weight:600;color:var(--ink2)}
.pipe-h button{border:0;background:none;color:var(--ink3);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;padding:0}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}
.sg .b{height:8px;border-radius:3px;background:var(--sunk);overflow:hidden;position:relative}
.sg .b i{position:absolute;left:0;top:0;bottom:0;background:var(--ink2)}
.sg.d .b i{background:var(--green)}
.sg .n{font-size:12.5px;font-weight:600;margin-top:5px;line-height:1.25}
.sg .m{font-size:11.5px;color:var(--ink3)}
.sg.l{opacity:.5}
.sg.cur .n{color:var(--ink)}
.sg.cur .b{box-shadow:0 0 0 1.5px var(--ink2)}
.strip2{position:relative;height:56px;margin-top:14px}
.strip2 .pl,.strip2 .fc,.strip2 .lt{position:absolute;border-radius:3px}
.strip2 .pl{top:14px;height:7px;background:var(--ghost)}
.strip2 .fc{top:25px;height:10px;background:var(--ink2)}
.strip2 .lt{top:25px;height:10px;background:var(--ochre);border-radius:0 3px 3px 0}
.strip2 .td{position:absolute;top:11px;height:28px;width:2px;margin-left:-1px;background:var(--ink)}
.strip2 .ax{position:absolute;left:0;right:0;top:41px;height:1px;background:var(--rule2)}
.strip2 .tk{position:absolute;top:44px;font-size:11px;color:var(--ink3);transform:translateX(-50%)}
.strip2 .cap{position:absolute;top:-2px;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.pc small{font-size:11px;color:var(--ink3);font-weight:500;margin-left:1px}
.ghd .mn{top:0;height:24px;border-left:1px solid var(--rule2);padding:0}
.ghd .mn span{position:sticky;left:calc(var(--lw) + 8px);display:inline-block;padding:6px 7px 0;font-size:13px;font-weight:700;color:var(--ink)}

.c-body{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:0}
.c-left{padding:14px 20px 18px 26px;display:grid;gap:12px;border-right:1px solid var(--rule)}
.c-right{padding:14px 20px 18px;display:grid;gap:10px;align-content:start;background:color-mix(in srgb,var(--surface) 60%,var(--raised))}
.fld label{display:block;font-size:12px;color:var(--ink3);margin-bottom:3px;font-weight:500}
.ed{display:block;width:calc(100% + 9px);border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 9px;margin-left:-9px;resize:none;transition:border-color .15s,background-color .15s;field-sizing:content;min-height:34px}
textarea.ed{line-height:1.45}
.ed:hover{border-color:var(--rule)}
.ed:focus{outline:none;border-color:var(--ink3);background:var(--raised)}
.ed::placeholder{color:var(--ink3);font-style:italic}
.ed.prob{font-size:16px;font-weight:600;color:var(--red)}
.ed.sol{font-size:15px}
.frow{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:12px}
.frow .ed{font-weight:600}
.src{font-size:12.5px;color:var(--ink3)}
.src q{quotes:none;color:var(--ink2)}
.upd{font-size:12px;color:var(--ink3)}
/* этапы закупки */
.steps{display:grid;gap:4px}
.steps h4{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--ink2)}
.stp{display:grid;grid-template-columns:18px 1fr 100px 50px 56px 22px;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--rule)}
.stp .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink3)}
.stp.d .dot{background:var(--green);border-color:var(--green)}
.stp.w .dot{background:conic-gradient(var(--ink2) var(--p),transparent 0);border-color:var(--ink2)}
.stp.l{opacity:.55}
.stp input{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 5px}
.stp input:hover{border-color:var(--rule)}
.stp input:focus{outline:none;border-color:var(--ink3);background:var(--raised)}
.stp input[type=number]{text-align:right}
.stp .x{border:0;background:none;color:var(--ink3);font-size:16px;line-height:1;padding:0}
.stp .x:hover{color:var(--red)}
.addstep{justify-self:start;border:0;background:none;color:var(--ink2);font-size:13px;font-weight:600;padding:4px 0}
/* комментарии */
.cm{display:grid;gap:8px}
.cm h4{margin:0;font-size:13px;font-weight:600;color:var(--ink2)}
.cmi{background:var(--raised);border:1px solid var(--rule);border-radius:10px;padding:8px 11px;font-size:14px;position:relative}
.cmi .w{font-size:12px;color:var(--ink3);margin-bottom:2px}
.cmi .w b{color:var(--ink2);font-weight:600}
.cmi .del{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--ink3);opacity:0;font-size:15px}
.cmi:hover .del{opacity:1}
.cmadd{display:flex;gap:8px}
.cmadd textarea{flex:1;border:1px solid var(--rule2);border-radius:10px;padding:7px 10px;background:var(--raised);resize:none;field-sizing:content;min-height:36px;max-height:160px}
.cmadd textarea:focus{outline:none;border-color:var(--ink3)}
.arch{margin-top:30px;max-width:1320px}
.arch summary{cursor:pointer;font-weight:600;color:var(--ink2);font-size:14.5px;padding:8px 0;list-style:none}
.arch summary::-webkit-details-marker{display:none}
.arch summary:before{content:"▸";display:inline-block;margin-right:8px;transition:transform .2s var(--spring)}
.arch[open] summary:before{transform:rotate(90deg)}
.arch .cards{margin-top:10px}

/* ---------- график ---------- */
.gtools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}
.gtools .lab{font-size:12.5px;color:var(--ink3);margin-right:-6px}
.tgl{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.tgl input{display:none}
.tgl span{width:30px;height:18px;border-radius:9px;background:var(--rule2);position:relative;transition:background-color .2s}
.tgl span:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .25s var(--spring)}
.tgl input:checked+span{background:var(--ink)}
.tgl input:checked+span:after{transform:translateX(12px)}
.gcard{background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.gw{overflow:auto;height:calc(100vh - 290px);min-height:440px;position:relative;overscroll-behavior:contain}
.gin{position:relative;width:calc(var(--lw) + var(--W))}
.gbg{position:absolute;top:var(--hd);left:var(--lw);width:var(--W);bottom:0;z-index:0;pointer-events:none}
.gbg .we{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.gbg .mo{position:absolute;top:0;bottom:0;width:1px;background:var(--rule2)}
.gbg .tdy{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);opacity:.85}
.ghd{position:sticky;top:0;z-index:8;display:grid;grid-template-columns:var(--lw) var(--W);height:var(--hd);background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--rule2)}
.ghd .lc{position:sticky;left:0;z-index:9;background:var(--surface);border-right:1px solid var(--rule2);display:grid;align-items:end;padding-bottom:8px;font-size:12px;color:var(--ink3);font-weight:500}
.ghd .tc{position:relative}
.ghd .mn{position:absolute;white-space:nowrap}
.ghd .dy{position:absolute;bottom:7px;text-align:center;font-size:12px;color:var(--ink2);font-weight:500}
.ghd .dy.w{color:var(--ink3)}
.ghd .dy.t{color:var(--paper);font-weight:700}
.ghd .dy.t:before{content:"";position:absolute;inset:-3px 50%;margin-left:-13px;width:26px;border-radius:6px;background:var(--ink);z-index:-1}
.row{display:grid;grid-template-columns:var(--lw) var(--W);height:var(--rh);position:relative;z-index:1}
.row .lc,.ghd .lc{grid-template-columns:var(--cols)}
.row .lc{position:sticky;left:0;z-index:4;background:var(--surface);display:grid;align-items:center;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule2);cursor:pointer;transition:background-color .12s}
.row .tc{position:relative;border-bottom:1px solid color-mix(in srgb,var(--rule) 60%,transparent);cursor:pointer}
.row>.lc>*,.ghd .lc>*{padding:0 7px;min-width:0}
.row:hover .lc{background:color-mix(in srgb,var(--sunk) 45%,var(--surface))}
.row:hover .tc{background:color-mix(in srgb,var(--sunk) 22%,transparent)}
.row.sel .lc{background:color-mix(in srgb,var(--ink) 9%,var(--surface))}
.row.sel .tc{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.row.prob .lc{background:color-mix(in srgb,var(--red) 8%,var(--surface));box-shadow:inset 4px 0 0 var(--red)}

/* Ручной порядок открытых вопросов (S.order, этап 2). isOpen(uid) — вопрос открыт и его операция есть в плане.
   Вопросы, которых нет в S.order, считаются новыми и встают наверх (между собой — по прежней сортировке). */
function orderedIssues(order,issues,isOpen){const seen=new Set(),out=[];
 (order||[]).forEach(u=>{if(!seen.has(u)&&issues[u]&&isOpen(u)){seen.add(u);out.push(u)}});
 const rest=Object.keys(issues).map(Number).filter(u=>!seen.has(u)&&isOpen(u)).sort((a,b)=>{const da=issues[a].due||"9",db=issues[b].due||"9";return da<db?-1:da>db?1:a-b});

/* ================== подпись вопроса ==================
   Универсальное правило для любого вопроса (и будущих тоже): «наименование операции — суть проблемы», вся подпись не длиннее
   max знаков. Суть — первая фраза описания (конец фразы — точка перед заглавной буквой, «гл. 850» не режем). Описание
   получает до DESC_WANT знаков (или сколько у него есть), наименование — всё остальное; что не влезло — «…». Короткое
   описание отдаёт место названию, короткое название — описанию. */

/* новый или заново открытый вопрос — в самый верх */
const bumpTop=(order,u)=>[u,...(order||[]).filter(x=>x!==u)];
/* перенести u на место idx (0 — самый верх) среди списка order; порядок остальных сохраняется */
function moveIssue(order,u,idx){const o=(order||[]).filter(x=>x!==u);o.splice(Math.max(0,Math.min(idx,o.length)),0,u);return o}
/* Любое сохранённое состояние → v4. null — не наше состояние (нет версии или версия неизвестна). */
function migrateState(st){if(!st||typeof st!=="object")return null;
 if(st.v===3)st={...st,v:4,fileId:newFileId(),rev:0,order:issueOrder(st.issues),log:[]};

 for(const k of["tasks","issues","steps","open"])if(!st[k]||typeof st[k]!=="object")st[k]={};
 if(!st.fileId)st.fileId=b.fileId;if(!(st.rev>=0))st.rev=0;
 if(!Array.isArray(st.order))st.order=issueOrder(st.issues);if(!Array.isArray(st.log))st.log=[];

/* ================== стек отмены ==================
   Снимками, а не командами (ARCHITECTURE.md): одно действие пользователя (один save()) = один шаг,
   даже если пересчёт сдвинул десятки операций. snapNow() — строка с текущим планом и правками. */
const UNDO_MAX=50;

  commit(){const now=snapNow();if(now===last)return false;u.push(last);if(u.length>UNDO_MAX)u.shift();r.length=0;last=now;return true},
  undo(){if(!u.length)return null;r.push(last);last=u.pop();return last},
  redo(){if(!r.length)return null;u.push(last);last=r.pop();return last},

  rebase(){last=snapNow();saved=last},

/* ================== журнал изменений (docs/CHANGELOG-SPEC.md) ==================
   S.log = [{at, who, act, uid?, name?, field?, from?, to?, t?, n?}], новые в конце. Серия правок одного поля одним
   человеком подряд за 2 минуты — одна запись (было → стало итоговое); если вернули как было, записи нет. Лимит — 3000. */
const LOG_MAX=3000,LOG_MERGE_MS=120000;
function logPush(log,e,noMerge){const out=(log||[]).slice(),last=out[out.length-1];   // noMerge — сайт: записи в базе не исправляются
 if(!noMerge&&last&&e.field&&(e.act==="edit"||e.act==="issue")&&last.act===e.act&&last.uid===e.uid&&last.field===e.field&&(last.who||"")===(e.who||"")&&Date.parse(e.at)-Date.parse(last.at)<=LOG_MERGE_MS){

/* запись → строка без разметки (окно журнала и текст «отменено: …») */
function logText(e){const q=e.name?"«"+e.name+"»":"",dv=v=>typeof v==="string"&&/^\d{4}-\d\d-\d\d$/.test(v)?v.slice(8)+"."+v.slice(5,7)+"."+v.slice(2,4):v,ft=(a,b)=>(a=dv(a),b=dv(b),a!=null&&a!==""?a+" → "+(b===""||b==null?"—":b):(b??""));
 switch(e.act){
  case"edit":case"issue":return[q,e.field&&ft(e.from,e.to)?(e.field+" "+ft(e.from,e.to)):(e.field||"")].filter(Boolean).join(" — ");
  case"link":return q+" — предшественники "+ft(e.from,e.to);
  case"add":return"добавлена "+q+(e.t?", "+e.t:"");
  case"del":return"удалена "+q;
  case"shift":return"сдвинуто "+e.n+" "+(e.n%10===1&&e.n%100!==11?"операция":e.n%10>1&&e.n%10<5&&(e.n%100<10||e.n%100>20)?"операции":"операций")+(e.name?", окончание «"+e.name+"»: "+ft(e.from,e.to):"");
  case"comment":return"комментарий к "+q+(e.to?": "+e.to:e.t?" — "+e.t:"");
  case"import":return"импорт из Project: "+(e.t||"");
  case"save":return"сохранён файл, "+(e.t||"");
  case"undo":return"отменено: "+(e.t||"действие");
  case"redo":return"возвращено: "+(e.t||"действие");
  case"clear":return"журнал очищен";
  default:return e.t||""}}

if(typeof module!=="undefined")module.exports={STATE_V,newFileId,blankState,issueOrder,migrateState,UNDO_MAX,makeHistory,orderedIssues,bumpTop,moveIssue,firstSentence,issueLabel,LOG_MAX,LOG_MERGE_MS,logPush,logText};

/* ================== файл ↔ строки базы ==================
   Чистые функции без DOM и сети: план v2 (DATA) и состояние v4 (S) версии-файла ↔ строки таблиц supabase/schema.sql.
   toRows — перенос файла в базу (tools/seed.js) и запись правок; fromRows — чтение базы в модель дашборда.
   Что не переносится: S.open (вид, у каждого свой), S.me/fileId/rev/dirty/seeded (не нужны на сайте),
   S0/F0/par в DATA.tasks (их досчитывает buildModel). Тест «без потерь» — tests/unit/dbmap.test.js. */
const pad2 = n => String(n).padStart(2, '0');
// timestamp без пояса (местное время плана): база отдаёт 2026-08-08T00:00:00, файл хранит 2026-08-08T00:00.
const tsLocal = (v, sec) => (v == null || v === '' ? null : String(v).replace(' ', 'T').slice(0, sec ? 19 : 16));
// timestamptz: база отдаёт 2026-10-05T12:05:27.879+00:00, файл хранит toISOString().
const tsUTC = v => (v == null || v === '' ? null : new Date(v).toISOString());
const num = v => (v == null ? v : Number(v));

function toRows(DATA, S) {
  const st = S || {};
  const plan_meta = { id: 1, title: DATA.title || '', saved: DATA.saved || null, pv: DATA.pv || 2, last_import: st.lastImport || null };
  const tasks = (DATA.tasks || []).map((t, i) => ({
    uid: t.uid, pos: i, lvl: t.lvl, name: t.name || '', sum: !!t.sum, s: t.s || null, f: t.f || null,
    pct: +t.pct || 0, crit: !!t.crit, pred: (t.pred || []).map(p => (typeof p === 'object' ? { uid: p.uid, lag: +p.lag || 0 } : { uid: p, lag: 0 })),
    resp: t.resp || '', note: t.note || '', cons: t.constraint || null
  }));
  const task_state = [], comments = [];
  for (const [u, x] of Object.entries(st.tasks || {})) {
    if (x.at || x.by || x.pct != null) task_state.push({
      uid: +u, pct: x.pct != null ? +x.pct : null, pct_at: x.pctAt || null, pct_by: x.pctBy ?? null,
      at: x.at || null, by_name: x.by || ''
    });
    for (const c of x.cm || []) comments.push({ uid: +u, at: c.at, who: c.who || '', t: c.t, ...(c.id != null ? { id: c.id } : {}), ...(c.ck ? { ck: c.ck } : {}) });
  }
  const order = (st.order || []).map(Number);
  const issues = Object.entries(st.issues || {}).map(([u, i]) => {
    const k = order.indexOf(+u);
    return {
      uid: +u, problem: i.problem || '', solution: i.solution || '', who: i.who || '', due: i.due || null,
      impact: +i.impact || 0, gd: !!i.gd, status: i.status || 'открыт', ord: k >= 0 ? k : null, gone: i.gone || null,
      at: i.at || null, by_name: i.by || ''
    };
  });
  const steps = Object.entries(st.steps || {}).map(([u, x]) => ({ uid: +u, items: x.items || [], at: x.at || null, by_name: x.by || '' }));
  const log = (st.log || []).map(l => ({
    at: l.at, who: l.who || '', act: l.act, uid: l.uid ?? null, name: l.name ?? null, field: l.field ?? null,
    from_v: l.from === undefined ? null : l.from, to_v: l.to === undefined ? null : l.to, t: l.t ?? null,
    ...(l.id != null ? { id: l.id } : {}), ...(l._k ? { _k: l._k } : {})
  }));
  return { plan_meta, tasks, task_state, issues, steps, comments, log };
}

// rows: {plan_meta: строка или [строка], tasks, task_state, issues, steps, comments, log} — как вернула база.
function fromRows(rows) {
  const meta = (Array.isArray(rows.plan_meta) ? rows.plan_meta[0] : rows.plan_meta) || {};
  const tasks = (rows.tasks || []).slice().sort((a, b) => a.pos - b.pos || a.uid - b.uid).map((t, i) => {
    const o = {
      id: i + 1, uid: num(t.uid), lvl: num(t.lvl), name: t.name, sum: !!t.sum, s: tsLocal(t.s), f: tsLocal(t.f),
      pct: num(t.pct), crit: !!t.crit, pred: (t.pred || []).map(p => ({ uid: num(p.uid), lag: num(p.lag) })), resp: t.resp || '', note: t.note || ''
    };
    if (t.cons) o.constraint = tsLocal(t.cons);
    return o;
  });
  const DATA = { pv: num(meta.pv) || 2, saved: tsLocal(meta.saved, true), title: meta.title || '', tasks };

  const S = { v: 4, tasks: {}, issues: {}, steps: {}, open: {}, order: [], log: [], lastImport: meta.last_import ?? null };
  for (const r of rows.task_state || []) {
    const x = S.tasks[r.uid] = {};
    if (r.pct != null) { x.pct = num(r.pct); x.pctAt = tsUTC(r.pct_at); x.pctBy = r.pct_by ?? ''; }
    x.by = r.by_name; x.at = tsUTC(r.at);
  }
  const cms = (rows.comments || []).slice().sort((a, b) => (tsUTC(a.at) < tsUTC(b.at) ? -1 : tsUTC(a.at) > tsUTC(b.at) ? 1 : a.id - b.id));
  for (const c of cms) {
    const x = S.tasks[c.uid] = S.tasks[c.uid] || {};
    (x.cm = x.cm || []).push({ who: c.who, at: tsUTC(c.at), t: c.t, ...(c.id != null ? { id: num(c.id) } : {}), ...(c.ck ? { ck: c.ck } : {}) });
  }
  const ord = [];
  for (const r of rows.issues || []) {
    const i = S.issues[r.uid] = {
      problem: r.problem, solution: r.solution, who: r.who, due: r.due || '', impact: num(r.impact), gd: !!r.gd,
      status: r.status, at: tsUTC(r.at), by: r.by_name
    };
    if (r.gone) i.gone = r.gone;
    if (r.ord != null) ord.push([r.ord, num(r.uid)]);
  }
  S.order = ord.sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(x => x[1]);
  for (const r of rows.steps || []) S.steps[r.uid] = { items: r.items, at: tsUTC(r.at), by: r.by_name };
  S.log = (rows.log || []).slice().sort((a, b) => (tsUTC(a.at) < tsUTC(b.at) ? -1 : tsUTC(a.at) > tsUTC(b.at) ? 1 : (a.id || 0) - (b.id || 0))).map(r => {
    const l = { at: tsUTC(r.at), who: r.who, act: r.act };
    if (r.uid != null) l.uid = num(r.uid);
    if (r.name != null) l.name = r.name;
    if (r.field != null) l.field = r.field;
    if (r.from_v != null) l.from = r.from_v;
    if (r.to_v != null) l.to = r.to_v;
    if (r.t != null) l.t = r.t;
    if (r.id != null) l.id = num(r.id);
    return l;
  });
  return { DATA, S };
}

/* ================== что отправить в базу ==================
   diffRows(было, стало) — строки toRows до и после действия → список запросов. Поля «кто и когда» (at, by_name,
   pct_at, pct_by, who) не отправляются: их ставит база. Комментарий узнаётся по ck (ключ сайта) или id, запись журнала —
   по id (из базы) или _k (ещё не дошла); журнал только дописывается и очищается. opt.noOrd — у вошедшего нет права
   на порядок вопросов: место (ord) не сравнивается и не отправляется (новый вопрос и так встаёт наверх). */
const KEYED = { plan_meta: 'id', tasks: 'uid', task_state: 'uid', issues: 'uid', steps: 'uid' };
const STAMP = ['at', 'by_name', 'pct_at', 'pct_by'];
const rowWithout = (r, drop) => { const o = { ...r }; for (const k of drop) delete o[k]; return o; };
const asList = v => (Array.isArray(v) ? v : v ? [v] : []);
const cmKey = c => (c.ck ? 'k' + c.ck : '#' + c.id);
const logKey = l => (l.id != null ? '#' + l.id : 'k' + l._k);

function diffRows(was, now, opt = {}) {
  const ops = [];
  for (const [t, pk] of Object.entries(KEYED)) {
    const drop = t === 'issues' && opt.noOrd ? [...STAMP, 'ord'] : STAMP;
    const before = new Map(asList(was[t]).map(r => [r[pk], JSON.stringify(rowWithout(r, drop))]));
    const after = asList(now[t]);
    const up = after.filter(r => before.get(r[pk]) !== JSON.stringify(rowWithout(r, drop))).map(r => rowWithout(r, drop));
    if (up.length) ops.push({ table: t, op: 'upsert', rows: up, key: pk });
    const keep = new Set(after.map(r => r[pk]));
    const gone = [...before.keys()].filter(k => !keep.has(k));
    if (gone.length) ops.push({ table: t, op: 'delete', key: pk, vals: gone });
  }
  const cb = new Map(asList(was.comments).map(c => [cmKey(c), c])), ca = new Set(asList(now.comments).map(cmKey));
  const cIns = asList(now.comments).filter(c => !cb.has(cmKey(c))).map(c => ({ uid: c.uid, t: c.t, ...(c.ck ? { ck: c.ck } : {}) }));
  if (cIns.length) ops.push({ table: 'comments', op: 'insert', rows: cIns });
  const cDel = [...cb.values()].filter(c => !ca.has(cmKey(c)));
  if (cDel.some(c => c.id != null)) ops.push({ table: 'comments', op: 'delete', key: 'id', vals: cDel.filter(c => c.id != null).map(c => c.id) });
  if (cDel.some(c => c.id == null && c.ck)) ops.push({ table: 'comments', op: 'delete', key: 'ck', vals: cDel.filter(c => c.id == null && c.ck).map(c => c.ck) });
  const lb = new Set(asList(was.log).map(logKey)), la = new Set(asList(now.log).map(logKey));
  const lIns = asList(now.log).filter(l => l.id == null && !lb.has(logKey(l)))
    .map(l => ({ act: l.act, uid: l.uid, name: l.name, field: l.field, from_v: l.from_v, to_v: l.to_v, t: l.t }));
  if (lIns.length) ops.push({ table: 'log', op: 'insert', rows: lIns });
  const lDel = asList(was.log).filter(l => l.id != null && !la.has(logKey(l))).map(l => l.id);
  if (lDel.length) ops.push({ table: 'log', op: 'delete', key: 'id', vals: lDel });
  return ops;
}

/* Та же ли картина без учёта «кто и когда» и журнала: отличие = правка другого человека (сбросить отмену). */
function sameContent(a, b, opt = {}) {
  const norm = R => JSON.stringify(Object.keys(KEYED).map(t => asList(R[t]).map(r => rowWithout(r, t === 'issues' && opt.noOrd ? [...STAMP, 'ord'] : STAMP))
    .sort((x, y) => (x[KEYED[t]] > y[KEYED[t]] ? 1 : -1))).concat([asList(R.comments).map(c => cmKey(c) + '|' + c.uid + '|' + c.t).sort()]));
  return norm(a) === norm(b);
}

if (typeof module !== 'undefined') module.exports = { toRows, fromRows, tsLocal, tsUTC, diffRows, sameContent };

/* ================== обёртка Supabase ==================
   Все обращения к Supabase — только здесь (CLAUDE.md, правило 3). Остальной код знает только функции makeDb.
   Запасной путь через свой домен = другой SB_URL. В браузере — глобальная makeDb, в Node — module.exports (тесты на моке).
   В localStorage supabase-js хранит только сессию входа. */
const SB_URL = 'https://kzzyttgdlbhhusklpflk.supabase.co';
const SB_KEY = 'sb_publishable_wFI2_ijY2I2G6CvPifB4ag_Peg9Eg41'; // публичный ключ, его можно видеть всем
const DB_TABLES = ['plan_meta', 'tasks', 'task_state', 'issues', 'steps', 'comments', 'log'];

function makeDb(createClient, url = SB_URL, key = SB_KEY) {

  return {
    url,
    async session() { return chk(await sb.auth.getSession()).session; },
    async signIn(email, password) { return chk(await sb.auth.signInWithPassword({ email, password })).user; },
    async signOut() { await sb.auth.signOut(); },
    // Кто вошёл: имя, роль и права ({действие: true/false}); null — вошёл, но роли нет.
    async me() {
      const s = await this.session();
      if (!s) return null;
      const p = chk(await sb.from('profiles').select('user_id,name,role').eq('user_id', s.user.id));
      if (!p || !p.length) return null;
      const perms = chk(await sb.from('permissions').select('action,admin,planner,manager,viewer'));
      const can = Object.fromEntries(perms.map(r => [r.action, !!r[p[0].role]]));
      return { uid: s.user.id, email: s.user.email, name: p[0].name || s.user.email, role: p[0].role, can };
    },
    // Все данные плана — строками таблиц (src/dbmap.js, fromRows).
    async load() {

    async write(ops) {

        else if (o.op === 'insert') chk(await q.insert(o.rows));

       Перед подпиской каналу передаётся ключ вошедшего (иначе при восстановленном входе канал — гость, проба 06.10);

    subscribe(onChange, onStatus) {

function dbErr(e) {
  const m = (e && e.message) || String(e);
  if (/Failed to fetch|NetworkError|Load failed|ERR_|network/i.test(m)) return 'нет связи с сервером';
  if (/Invalid login credentials/i.test(m)) return 'неверная почта или пароль';
  if (/Email not confirmed/i.test(m)) return 'почта не подтверждена — администратору: включить Auto Confirm у пользователя';
  if (/нет прав:/.test(m)) return m.slice(m.indexOf('нет прав:'));

/* ================== синхронизация с базой ==================
   Без DOM. Действие в интерфейсе меняет DATA/S как раньше и зовёт save() → sync.run(): отличия от того, что уже
   в базе (base), уходят запросами diffRows, затем база перечитывается и картина обновляется. Правки другого человека
   (realtime или возврат на вкладку) — тот же run(): отправлять нечего, только перечитать.
   o.rows()        — строки toRows текущего DATA/S (src/dbmap.js);
   o.apply(L, remote) — показать данные базы L; remote — изменил кто-то другой; вернуть false — «не сейчас»
                     (человек печатает в поле), тогда o.later() позовёт run() снова;
   o.error(e, kind) — kind 'net' (правки остаются и уйдут при следующем run) или 'deny' (база отказала — показана её картина);
   o.noOrd()       — нет права на порядок вопросов. */
function makeSync(db, o) {
  let base = null, running = null, again = false;
  const norm = L => toRows(fromRows(L).DATA, fromRows(L).S);
  const isNet = e => /Failed to fetch|NetworkError|Load failed|ERR_|network|нет ответа/i.test((e && e.message) || String(e));
  async function loop() {
    for (let guard = 0; guard < 20; guard++) {
      again = false;
      const now = o.rows(), ops = diffRows(base, now, { noOrd: o.noOrd() });
      if (ops.length) {
        try { await db.write(ops); }
        catch (e) {
          if (isNet(e)) { o.error(e, 'net'); return; }
          o.error(e, 'deny');
          const L = await db.load();               // база — истина: вернуть её картину
          o.apply(L, true); base = o.rows(); return;
        }
        base = now;
        continue;
      }
      let L;
      try { L = await db.load(); } catch (e) { o.error(e, 'net'); return; }
      if (again || diffRows(base, o.rows(), { noOrd: o.noOrd() }).length) continue;   // пока читали, появились новые правки
      const remote = !sameContent(norm(L), base, { noOrd: o.noOrd() });
      if (o.apply(L, remote) === false) { o.later(); return; }
      base = o.rows();
      return;
    }

    // Первая загрузка после входа.
    async start() { const L = await db.load(); o.apply(L, true); base = o.rows(); },
    // Отправить свои правки (если есть) и перечитать базу. Повторный вызов во время работы — ещё один круг.
    run() {
      if (!base) return Promise.resolve();
      if (running) { again = true; return running; }
      running = loop().finally(() => { running = null; if (again) api.run(); });
      return running;
    },
    busy: () => !!running,
    pending: () => !!base && diffRows(base, o.rows(), { noOrd: o.noOrd() }).length > 0
  };
  return api;
}

function parseXML(text){const doc=new DOMParser().parseFromString(text,"application/xml");
 if(doc.querySelector("parsererror"))throw new Error("Файл не читается как XML");
 const L=(el,n)=>{for(const c of el.children)if(c.localName===n)return c.textContent;return ""};
 const kids=(el,n)=>[...el.children].filter(c=>c.localName===n);
 const root=doc.documentElement;if(root.localName!=="Project")throw new Error("Это не выгрузка Microsoft Project");
 const alias={};[...doc.getElementsByTagName("*")].filter(e=>e.localName==="ExtendedAttribute"&&[...e.children].some(c=>c.localName==="Alias"))
  .forEach(e=>{alias[L(e,"Alias")]=L(e,"FieldID")});
 const RESP=alias["Ответственный исполнитель"],NOTE=alias["примечание"];
 const out=[];
 [...doc.getElementsByTagName("*")].filter(e=>e.localName==="Task").forEach(e=>{
  const uid=+L(e,"UID"),id=+L(e,"ID");if(!uid||!id)return;
  const ea={};kids(e,"ExtendedAttribute").forEach(x=>ea[L(x,"FieldID")]=L(x,"Value"));
  const cut=s=>s?s.slice(0,16):"";
  out.push({id,uid,lvl:+L(e,"OutlineLevel")||1,name:(L(e,"Name")||"").replace(/\s+/g," ").trim(),
   sum:L(e,"Summary")==="1",s:cut(L(e,"Start")),f:cut(L(e,"Finish")),pct:+L(e,"PercentComplete")||0,
   crit:L(e,"Critical")==="1",
   pred:kids(e,"PredecessorLink").filter(x=>(L(x,"Type")||"1")==="1").map(x=>({uid:+L(x,"PredecessorUID"),lag:(+L(x,"LinkLag")||0)/600})),
   resp:(RESP&&ea[RESP]||"").trim(),note:(NOTE&&ea[NOTE]||"").trim()})});
 if(!out.length)throw new Error("В файле не найдено ни одной задачи");
 return {pv:2,saved:L(root,"LastSaved")||"",title:L(root,"Title")||"",tasks:out}}
function parents(list){const st=[],m={};list.forEach(t=>{while(st.length&&st[st.length-1].lvl>=t.lvl)st.pop();m[t.uid]=st.length?st[st.length-1].uid:null;st.push(t)});return m}
function diffData(a,b){const A={},B={};a.tasks.forEach(t=>A[t.uid]=t);b.tasks.forEach(t=>B[t.uid]=t);
 const PA=parents(a.tasks),PB=parents(b.tasks);
 const added=[],removed=[],shifted=[],pctC=[],renamed=[],respC=[],noteC=[],moved=[];
 b.tasks.forEach(t=>{if(t.sum)return;const o=A[t.uid];if(!o){added.push(t.uid);return}
  if(o.s!==t.s||o.f!==t.f)shifted.push(t.uid);
  if(o.pct!==t.pct)pctC.push(t.uid);
  if(o.name!==t.name)renamed.push(t.uid);
  if((o.resp||"")!==(t.resp||""))respC.push(t.uid);
  if((o.note||"")!==(t.note||""))noteC.push(t.uid);
  if(PA[t.uid]!==PB[t.uid])moved.push(t.uid)});
 a.tasks.forEach(t=>{if(!B[t.uid]&&!t.sum)removed.push({uid:t.uid,name:t.name})});
 const conf=pctC.filter(x=>S.tasks[x]&&S.tasks[x].pct!=null&&S.tasks[x].pct!==B[x].pct).map(x=>({u:x,proj:B[x].pct,our:S.tasks[x].pct,who:S.tasks[x].pctBy,at:S.tasks[x].pctAt}));
 return{added,removed,shifted,pctC,renamed,respC,noteC,moved,conf,A,B}}

let SW=null;
document.addEventListener("pointerdown",e=>{const h=e.target.closest&&e.target.closest("#drawer .dr-h");if(!h||!PHONE()||LAND()||e.target.closest(".dr-x"))return;SW={y:e.clientY,dy:0};$("#drawer").style.transition="none"});
document.addEventListener("pointermove",e=>{if(!SW)return;SW.dy=Math.max(0,e.clientY-SW.y);$("#drawer").style.transform=`translateY(${SW.dy}px)`});
const swEnd=()=>{if(!SW)return;const d=SW.dy;SW=null;const dr=$("#drawer");dr.style.transition="";dr.style.transform="";if(d>90)closeDrawer()};
document.addEventListener("pointerup",swEnd);document.addEventListener("pointercancel",swEnd);
$("#dback").addEventListener("click",closeDrawer);

/* ================== САЙТ: вход и связь с базой ==================
   Только в сборке сайта (build.py --site). Вход по почте и паролю вместо «Кто вносит правку?»; автор правки —
   вошедший (имя из profiles, база ставит его сама). Данные — из базы (src/sync.js): правка уходит сразу,
   правки других приходят по realtime, а без него — при возврате на вкладку и раз в минуту. */
// Мок — только в тестовой сборке (build.py --site --mock); проверка по функции, а не по window.MOCK_SB (его мог бы подменить элемент с таким id).
const DB=SITE?makeDb(typeof makeMockSupabase==="function"?MOCK_SB.createClient:supabase.createClient):null;   // в «копии» базы нет
let ME_=null,SYNC=null,BOOTED=false,WAIT=false,rtOff=null,rtT=null;
const siteCan=a=>!!(ME_&&ME_.can[a]);
const siteWriter=()=>!!ME_&&Object.entries(ME_.can).some(([k,v])=>v&&k!=="log_clear");
const newKey=()=>crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
/* Человек печатает или открыто окно — картину базы показываем после (иначе перерисовка съест ввод). */
const busyUI=()=>$("#scrim").classList.contains("on")||!!document.activeElement&&document.activeElement.matches("main input,main textarea,main select,#drawer input,#drawer textarea,#drawer select");

let logK=0;
function siteRows(){for(const l of S.log)if(l.id==null&&!l._k)l._k="k"+(++logK);return toRows(DATA,S)}
function siteApply(L,remote){
 if(BOOTED&&busyUI())return false;
 const x=fromRows(L),open=S.open||{};
 DATA=x.DATA;S={...blankState(),...x.S,open,me:ME_.name,dirty:false};
 if(!BOOTED){BOOTED=true;boot();renderMe();$('[data-act="impx"]').hidden=!(siteCan("import")&&siteCan("plan_edit"));return true}
 buildModel();
 if(remote){HIST=makeHistory(snapNow);UNDO_D.length=0;REDO_D.length=0;toast.hot=false}   // чужая правка: отмена не должна её затереть
 else HIST.rebase();
 UI.blocks=UI.blocks.filter(k=>BK[k]);if(!UI.blocks.length){const b=BLOCKS.find(y=>y.def&&y.kind!=="misc")||BLOCKS[0];if(b)UI.blocks=[b.key]}
 if(UI.sel&&!byId[UI.sel])closeDrawer();
 $("#asof").innerHTML=asofHTML();rerender();return true}
function siteError(e,kind){
 if(kind==="net"){toast("Нет связи с сервером — правки сохранятся, когда связь вернётся");setTimeout(()=>SYNC.run(),15000);return}
 toast("Не сохранено: "+dbErr(e))}

/* ---- вход ---- */
function loginHTML(msg){return `<div class="login-card"><h1>Статус проекта ГДТ</h1><p>Вход для сотрудников</p>
 <form id="loginF"><label>Почта<input type="email" id="lgE" autocomplete="username" required></label>
 <label>Пароль<input type="password" id="lgP" autocomplete="current-password" required></label>
 <div class="login-err" id="lgErr">${esc(msg||"")}</div><button class="btn pri" id="lgB">Войти</button></form>
 <p class="m">Нет доступа или забыли пароль — к администратору.</p></div>`}
function showLogin(msg){let w=$("#login");if(!w){w=document.createElement("div");w.id="login";w.className="login";document.body.appendChild(w)}
 w.innerHTML=loginHTML(msg);w.hidden=false;
 $("#loginF").onsubmit=async e=>{e.preventDefault();const b=$("#lgB");b.disabled=true;$("#lgErr").textContent="";
  try{await DB.signIn($("#lgE").value.trim(),$("#lgP").value);await afterLogin()}
  catch(x){$("#lgErr").textContent=dbErr(x)}finally{b.disabled=false}};
 setTimeout(()=>$("#lgE").focus(),0)}
function hideLogin(){const w=$("#login");if(w)w.hidden=true}
async function afterLogin(){
 ME_=await DB.me();
 if(!ME_){await DB.signOut();return showLogin("У вас ещё нет роли — администратору: Table Editor → profiles → role")}
 SYNC=makeSync(DB,{rows:siteRows,apply:siteApply,later:()=>{WAIT=true},error:siteError,noOrd:()=>!siteCan("issue_order")});
 await SYNC.start();hideLogin();live()}
async function siteLogout(){if(SYNC&&(SYNC.busy()||SYNC.pending()))return toast("Подождите: правки ещё сохраняются");
 if(rtOff)rtOff();await DB.signOut();location.reload()}

/* ---- обновления от других ---- */
function live(){if(rtOff)rtOff();
 rtOff=DB.subscribe(()=>{clearTimeout(rtT);rtT=setTimeout(()=>SYNC.run(),400)},
  st=>{if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")setTimeout(live,20000)})}   // realtime может не подключиться — повтор
document.addEventListener("visibilitychange",()=>{if(SYNC&&!document.hidden)SYNC.run()});
addEventListener("online",()=>{if(SYNC)SYNC.run()});
setInterval(()=>{if(!SYNC)return;if(WAIT&&!busyUI()){WAIT=false;SYNC.run()}},1000);
setInterval(()=>{if(SYNC&&!document.hidden)SYNC.run()},60000);

/* ---- «Скачать копию»: автономный файл со снимком данных (на случай, если Supabase недоступен) ----
   Та же страница, но с данными внутри: открывается как версия-файл (SITE=false), без входа, с плашкой «копия от …». */
function siteCopy(){const at=new Date(),st={...S,me:"",dirty:false,seeded:1,open:{},copyAt:at.toISOString()};
 const out="<!DOCTYPE html>\n"+SRC.replace(/(<script id="mpp"[^>]*>)[\s\S]*?(<\/script>)/,(m,a,b)=>a+j4(DATA)+b)
  .replace(/(<script id="state"[^>]*>)[\s\S]*?(<\/script>)/,(m,a,b)=>a+j4(st)+b);
 const blob=new Blob([out],{type:"text/html;charset=utf-8"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download=`СтатусСАЙТ-копия-${p2(at.getDate())}.${p2(at.getMonth()+1)}.${p2(at.getFullYear()%100)}.html`;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
 toast("Копия сохранена в «Загрузки» — открывается без интернета")}

if(SITE){$("#saveBtn").style.display="none";$("#copyBtn").hidden=false}
if(SITE)(async()=>{let s=null;try{s=await DB.session()}catch(e){}
 if(!s)return showLogin();
 try{await afterLogin()}catch(e){showLogin(dbErr(e))}})();

</script>
